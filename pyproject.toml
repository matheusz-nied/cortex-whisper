[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsar-whisper"
dynamic = ["version"]
description = "Private, local AI voice dictation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Matheus Fernandes da Silva", email = "matheusz.nied@gmail.com" }]
maintainers = [{ name = "Matheus Fernandes da Silva", email = "matheusz.nied@gmail.com" }]
dependencies = [
  "faster-whisper>=1.2.1,<2",
  "numpy>=2.2,<3",
  "platformdirs>=4.3,<5",
  "pynput>=1.8,<2",
  "PySide6>=6.8.6,<7",
  "sounddevice>=0.5.2,<1",
]

[project.scripts]
pulsar-whisper = "pulsar_whisper.__main__:main"
whisper-ditado = "pulsar_whisper.__main__:main"

[project.gui-scripts]
pulsar-whisper-gui = "pulsar_whisper.__main__:main"

[project.urls]
Homepage = "https://github.com/matheusz-nied/pulsar-whisper"
Repository = "https://github.com/matheusz-nied/pulsar-whisper"
Issues = "https://github.com/matheusz-nied/pulsar-whisper/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = { attr = "pulsar_whisper.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
