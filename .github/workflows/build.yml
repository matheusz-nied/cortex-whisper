name: CI and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.10"
          - os: ubuntu-24.04
            python: "3.13"
          - os: ubuntu-24.04
            python: "3.14"
          - os: windows-2022
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest

      - name: Run Ruff
        run: python -m ruff check .

      - name: Compile Python sources
        run: python -m compileall -q cortex_whisper.py src

  package-deb:
    name: Package .deb (Ubuntu ${{ matrix.ubuntu }})
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            appstream build-essential ca-certificates curl git libportaudio2

      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build target-specific Debian package
        run: scripts/build_linux.sh
        env:
          DISTRO_VERSION: ${{ matrix.ubuntu }}

      - name: Validate package
        shell: bash
        run: |
          package="dist/cortex-whisper_0.2.0-1_ubuntu${{ matrix.ubuntu }}_amd64.deb"
          dpkg-deb --info "$package"
          appstreamcli validate --no-net \
            build/deb-root/usr/share/metainfo/io.github.matheusz_nied.CortexWhisper.metainfo.xml
          dist/cortex-whisper/cortex-whisper --version
          dist/cortex-whisper/cortex-whisper --self-test
          cd dist
          sha256sum --check "SHA256SUMS-ubuntu${{ matrix.ubuntu }}"

      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: cortex-whisper-deb-ubuntu${{ matrix.ubuntu }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/cortex-whisper_0.2.0-1_ubuntu${{ matrix.ubuntu }}_amd64.deb
            dist/SHA256SUMS-ubuntu${{ matrix.ubuntu }}

  package-flatpak:
    name: Package Flatpak (Linux x86_64)
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Flatpak builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --noninteractive flathub \
            org.kde.Sdk//6.11 io.qt.PySide.BaseApp//6.11

      - name: Build Flatpak bundle
        run: scripts/build_flatpak.sh

      - name: Validate Flatpak contents
        run: |
          flatpak build build/flatpak-build cortex-whisper --version
          flatpak build build/flatpak-build cortex-whisper --self-test
          flatpak build build/flatpak-build cortex-whisper --diagnostics
          test -f build/flatpak-build/files/lib/python3.13/site-packages/av.py
          test ! -d build/flatpak-build/files/lib/python3.13/site-packages/av.libs
          test ! -d build/flatpak-build/files/lib/python3.13/site-packages/av
          test -f build/flatpak-build/files/share/doc/cortex-whisper/THIRD_PARTY_NOTICES.md
          test -f build/flatpak-build/files/share/licenses/portaudio/LICENSE
          test -f build/flatpak-build/files/share/licenses/ydotool/LICENSE
          cd dist
          sha256sum --check SHA256SUMS-flatpak

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v7
        with:
          name: cortex-whisper-flatpak
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/Cortex-Whisper-0.2.0-x86_64.flatpak
            dist/SHA256SUMS-flatpak

  package-windows:
    name: Package Windows (experimental)
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: powershell
        run: scripts/build_windows.ps1

      - name: Validate packaged executable
        shell: powershell
        run: |
          dist\cortex-whisper\cortex-whisper.exe --version
          dist\cortex-whisper\cortex-whisper.exe --self-test

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: cortex-whisper-windows
          if-no-files-found: error
          retention-days: 14
          path: dist/Cortex-Whisper-Setup-*.exe

  release:
    name: Create GitHub pre-release
    needs: [package-deb, package-flatpak, package-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: cortex-whisper-*
          path: release-assets
          merge-multiple: true

      - name: Generate release checksums
        working-directory: release-assets
        env:
          YDOTOOL_SOURCE_SHA256: ba075a43aa6ead51940e892ecffa4d0b8b40c241e4e2bc4bd9bd26b61fde23bd
        run: |
          curl -L --fail --output ydotool-1.0.4-source.tar.gz \
            https://github.com/ReimuNotMoe/ydotool/archive/refs/tags/v1.0.4.tar.gz
          echo "$YDOTOOL_SOURCE_SHA256  ydotool-1.0.4-source.tar.gz" | sha256sum --check --strict
          sha256sum *.deb *.flatpak *.exe *.tar.gz > SHA256SUMS

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "Cortex Whisper $GITHUB_REF_NAME Beta" \
            --generate-notes \
            --prerelease
