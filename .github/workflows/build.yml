name: CI and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.10"
          - os: ubuntu-22.04
            python: "3.13"
          - os: ubuntu-22.04
            python: "3.14"
          - os: windows-2022
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest

      - name: Run Ruff
        run: python -m ruff check .

      - name: Compile Python sources
        run: python -m compileall -q cortex_whisper.py cortex_shortcut_portal.py src

  package-linux:
    name: Package Linux (Ubuntu 22.04)
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    env:
      APPIMAGETOOL_SHA256: a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0
      APPIMAGE_RUNTIME_SHA256: 1cc49bcf1e2ccd593c379adb17c9f85a36d619088296504de95b1d06215aebbf
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream libportaudio2

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Download verified AppImage tools
        run: |
          curl -L --fail --output appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          curl -L --fail --output appimage-runtime-x86_64 \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          echo "$APPIMAGETOOL_SHA256  appimagetool" | sha256sum --check --strict
          echo "$APPIMAGE_RUNTIME_SHA256  appimage-runtime-x86_64" | sha256sum --check --strict
          chmod +x appimagetool
          sudo install -m 0755 appimagetool /usr/local/bin/appimagetool

      - name: Build Debian package and AppImage
        run: scripts/build_linux.sh
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          APPIMAGE_RUNTIME_FILE: ${{ github.workspace }}/appimage-runtime-x86_64

      - name: Validate packaged executables
        run: |
          for library in libgio-2.0.so.0 libglib-2.0.so.0 libgmodule-2.0.so.0 libgobject-2.0.so.0 libgthread-2.0.so.0; do
            test ! -e "dist/cortex-whisper/_internal/$library"
          done
          dist/cortex-whisper/cortex-whisper --version
          dist/cortex-whisper/cortex-whisper --help >/dev/null
          dist/cortex-whisper/cortex-whisper --self-test
          dist/cortex-whisper/cortex-whisper --diagnostics
          APPIMAGE_EXTRACT_AND_RUN=1 dist/Cortex-Whisper-*-x86_64.AppImage --version
          APPIMAGE_EXTRACT_AND_RUN=1 dist/Cortex-Whisper-*-x86_64.AppImage --self-test

      - name: Validate package metadata and checksums
        run: |
          appstreamcli validate --no-net \
            build/deb-root/usr/share/metainfo/io.github.matheusz_nied.CortexWhisper.metainfo.xml
          dpkg-deb --info dist/cortex-whisper_*_amd64.deb
          cd dist
          sha256sum --check SHA256SUMS

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: cortex-whisper-linux
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/cortex-whisper_*_amd64.deb
            dist/Cortex-Whisper-*-x86_64.AppImage
            dist/SHA256SUMS

  package-windows:
    name: Package Windows (experimental)
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: powershell
        run: scripts/build_windows.ps1

      - name: Validate packaged executable
        shell: powershell
        run: |
          dist\cortex-whisper\cortex-whisper.exe --version
          dist\cortex-whisper\cortex-whisper.exe --self-test

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: cortex-whisper-windows
          if-no-files-found: error
          retention-days: 14
          path: dist/Cortex-Whisper-Setup-*.exe

  validate-linux-portability:
    name: Validate Linux package (Ubuntu 24.04)
    needs: package-linux
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download Linux packages
        uses: actions/download-artifact@v8
        with:
          name: cortex-whisper-linux
          path: dist

      - name: Install newer desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y dconf-gsettings-backend gvfs-libs libportaudio2 python3-dbus python3-gi
          sudo apt-get install -y ./dist/cortex-whisper_*_amd64.deb

      - name: Smoke-test Linux packages against newer GIO modules
        shell: bash
        run: |
          chmod +x dist/Cortex-Whisper-*-x86_64.AppImage
          smoke_test() {
            local label="$1"
            shift
            mkdir -p "$RUNNER_TEMP/$label-state" "$RUNNER_TEMP/$label-config"
            set +e
            timeout 8s env \
              QT_QPA_PLATFORM=offscreen \
              XDG_STATE_HOME="$RUNNER_TEMP/$label-state" \
              XDG_CONFIG_HOME="$RUNNER_TEMP/$label-config" \
              "$@" >"$label-smoke.log" 2>&1
            local status=$?
            set -e
            cat "$label-smoke.log"
            grep -q "Cortex Whisper started" "$label-smoke.log"
            if grep -E "undefined symbol|Failed to load module|version .+ not found" "$label-smoke.log"; then
              exit 1
            fi
            if [[ "$status" -ne 0 && "$status" -ne 124 ]]; then
              exit "$status"
            fi
          }
          smoke_test appimage \
            APPIMAGE_EXTRACT_AND_RUN=1 \
            dist/Cortex-Whisper-*-x86_64.AppImage
          smoke_test debian cortex-whisper

  release:
    name: Create GitHub pre-release
    needs: [package-linux, validate-linux-portability, package-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: cortex-whisper-*
          path: release-assets
          merge-multiple: true

      - name: Generate release checksums
        working-directory: release-assets
        run: sha256sum *.deb *.AppImage *.exe > SHA256SUMS

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "Cortex Whisper $GITHUB_REF_NAME Beta" \
            --generate-notes \
            --prerelease
